<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2eb">
  <title>我的作品集</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20251f;
      --muted: #777b70;
      --green: #426b4c;
      --paper: #fbfaf6;
      --line: #e8e5db;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    .page {
      width: min(100% - 40px, 1060px);
      margin-inline: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 25px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--ink);
      font-size: .95rem;
      font-weight: 900;
      letter-spacing: .05em;
      text-decoration: none;
    }

    .header-note {
      color: var(--muted);
      font-size: .84rem;
    }

    main { padding-block: clamp(52px, 10vw, 104px) 80px; }

    .intro { margin-bottom: 42px; }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--green);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: .025em;
      line-height: 1.15;
    }

    .intro-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 20px;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }

    .count {
      flex: 0 0 auto;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      font-size: .9rem;
      font-weight: 800;
    }

    .count-number { color: var(--green); }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 17px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: .04em;
    }

    .section-heading span {
      color: var(--muted);
      font-size: .8rem;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .project-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      color: inherit;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: #d3ddcf;
      box-shadow: 0 14px 32px #253c2512;
    }

    .project-card:focus-visible {
      outline: 3px solid #6f936e;
      outline-offset: 4px;
    }

    .art {
      position: relative;
      min-height: 220px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .art-stickman {
      background:
        radial-gradient(ellipse at 50% 120%, #a9d8f1 0 32%, transparent 32.5%),
        linear-gradient(160deg, #d9f0fd, #edf8fc 70%);
    }

    .art-stickman::before,
    .art-stickman::after {
      position: absolute;
      bottom: 17%;
      width: 23%;
      height: 7px;
      border-radius: 99px;
      background: #99c9e2;
      content: "";
    }

    .art-stickman::before { left: 8%; transform: rotate(-15deg); }
    .art-stickman::after { right: 8%; transform: rotate(15deg); }

    .stick-figure {
      position: relative;
      z-index: 1;
      width: 62px;
      height: 100px;
      margin-top: 18px;
    }

    .stick-head {
      position: absolute;
      top: 0;
      left: 18px;
      width: 26px;
      height: 26px;
      border: 4px solid #294d67;
      border-radius: 50%;
      background: #f7fbfd;
    }

    .stick-body,
    .stick-arm,
    .stick-leg {
      position: absolute;
      left: 29px;
      width: 4px;
      border-radius: 8px;
      background: #294d67;
      transform-origin: top center;
    }

    .stick-body { top: 24px; height: 42px; }
    .stick-arm { top: 36px; height: 33px; }
    .stick-arm.left { transform: rotate(48deg); }
    .stick-arm.right { transform: rotate(-48deg); }
    .stick-leg { top: 62px; height: 36px; }
    .stick-leg.left { transform: rotate(30deg); }
    .stick-leg.right { transform: rotate(-30deg); }

    .art-mole {
      background:
        radial-gradient(ellipse at 50% 120%, #9ac76b 0 42%, transparent 42.5%),
        linear-gradient(155deg, #eef7db, #e1efc9 75%);
    }

    .art-mole::before,
    .art-mole::after {
      position: absolute;
      bottom: 23%;
      width: 39%;
      height: 33px;
      border-radius: 50%;
      background: linear-gradient(#a56a45, #75442f);
      content: "";
    }

    .art-mole::before { left: 10%; transform: rotate(-8deg); }
    .art-mole::after { right: 10%; transform: rotate(8deg); }

    .mole-character {
      position: relative;
      z-index: 1;
      width: 116px;
      height: 118px;
      display: grid;
      place-items: center;
      margin-top: 12px;
      border: 6px solid #805338;
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(145deg, #e2b27e, #bb8051);
      box-shadow: inset -10px -8px 0 #a56d49, 0 10px 0 #6b913f;
      font-size: 4rem;
    }

    .art-label {
      position: absolute;
      top: 16px;
      left: 17px;
      padding: 6px 10px;
      border: 1px solid #ffffffa6;
      border-radius: 999px;
      background: #ffffffa8;
      color: #435c50;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .card-info { padding: 20px 21px 19px; }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-info h3 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: .025em;
    }

    .arrow {
      color: var(--green);
      font-size: 1.3rem;
      transition: transform 180ms ease;
    }

    .project-card:hover .arrow { transform: translateX(4px); }

    .card-info p {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f1f3ed;
      color: #58664f;
      font-size: .74rem;
      font-weight: 700;
    }

    footer {
      padding-block: 18px 26px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .8rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 32px, 500px); }
      .header-note { font-size: .75rem; }
      .intro-bottom { align-items: flex-start; flex-direction: column; }
      .projects { grid-template-columns: 1fr; gap: 16px; }
      .art { min-height: 205px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="回到作品集首頁">MY PORTFOLIO</a>
      <span class="header-note">遊戲與互動作品</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A LITTLE COLLECTION OF MY WORK</p>
        <h1 id="page-title">我的作品集</h1>
        <div class="intro-bottom">
          <p class="description">歡迎來逛逛！點選作品圖卡，就能開始體驗。</p>
          <p class="count" aria-live="polite">目前共有 <span class="count-number" id="project-count">0</span> 個作品</p>
        </div>
      </section>

      <section aria-labelledby="projects-title">
        <div class="section-heading">
          <h2 id="projects-title">精選作品</h2>
          <span>點擊圖卡進入作品 ↗</span>
        </div>

        <div class="projects">
          <a class="project-card" href="1020/index.html">
            <div class="art art-stickman" aria-hidden="true">
              <span class="art-label">01 / ACTION</span>
              <span class="stick-figure">
                <span class="stick-head"></span>
                <span class="stick-body"></span>
                <span class="stick-arm left"></span>
                <span class="stick-arm right"></span>
                <span class="stick-leg left"></span>
                <span class="stick-leg right"></span>
              </span>
            </div>
            <div class="card-info">
              <div class="card-topline">
                <h3>火柴人躲障礙</h3>
                <span class="arrow" aria-hidden="true">→</span>
              </div>
              <p>使用方向鍵或 WASD 移動火柴人，在畫布中自由探索。</p>
              <span class="tag">動作遊戲</span>
            </div>
          </a>

          <a class="project-card" href="1027/index.html">
            <div class="art art-mole" aria-hidden="true">
              <span class="art-label">02 / ARCADE</span>
              <span class="mole-character">🐹</span>
            </div>
            <div class="card-info">
              <div class="card-topline">
                <h3>打地鼠！</h3>
                <span class="arrow" aria-hidden="true">→</span>
              </div>
              <p>把握地鼠探頭的時機，挑戰 30 秒內的最高分數！</p>
              <span class="tag">反應挑戰</span>
            </div>
          </a>
        </div>
      </section>
    </main>

    <footer>每個小作品，都是一次新的嘗試。</footer>
  </div>

  <script>
    const projectCards = document.querySelectorAll(".project-card");
    document.querySelector("#project-count").textContent = projectCards.length;
  </script>
</body>
</html>
